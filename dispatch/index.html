<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>KKRP Police Dispatch - 911 Emergency Response</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common/common.css?v=1.0.4">
    <link rel="stylesheet" href="style.css?v=1.0.4">
    <script>
        if (!window.GetParentResourceName && (typeof cef === 'undefined' || !cef) && !window.cef) {
            document.documentElement.classList.add('preview-mode');
        }
    </script>
</head>
<body>

    <!-- Main Container Dispatch -->
    <div class="dispatch-wrapper" id="dispatchApp">
        <div class="dispatch-panel glass-panel">
            
            <div class="glow-accent-top"></div>

            <!-- Header -->
            <header class="dispatch-header">
                <div class="header-left">
                    <div class="dispatch-badge-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                    </div>
                    <div>
                        <div class="sys-tag">EMERGENCY COMM SYSTEM</div>
                        <h1 class="sys-title">Police 911 Dispatch Feed</h1>
                    </div>
                </div>

                <div class="header-right">
                    <div class="channel-badge">
                        <span class="live-dot"></span>
                        <span id="dispatchChannel">TAC-1 DISPATCH (ONLINE)</span>
                    </div>
                    <button class="btn-close-dispatch" id="btnCloseDispatch" title="Tutup [ESC]">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Alert Feed List -->
            <main class="dispatch-feed" id="dispatchFeed">
                <!-- Di-render dinamis oleh script.js -->
            </main>

            <!-- Footer Controls -->
            <footer class="dispatch-footer">
                <div class="footer-meta">
                    <span id="activeAlertCount">3 Panggilan Darurat Aktif</span>
                    <span>• Tekan [G] untuk attach panggilan terbaru</span>
                </div>
                <button class="btn-clear-all" id="btnClearResolved">Bersihkan Selesai</button>
            </footer>
        </div>
    </div>

    <!-- Floating HUD Mini Notification (Saat in-game) -->
    <div class="dispatch-mini-hud" id="dispatchMiniHud" style="display: none;">
        <div class="mini-alert-card" id="miniAlertCard">
            <div class="mini-alert-header">
                <span class="alert-code code-red" id="miniCode">10-71</span>
                <span class="mini-title" id="miniTitle">Penembakan di Idlewood</span>
                <span class="mini-time" id="miniTime">Baru saja</span>
            </div>
            <p class="mini-desc" id="miniDesc">Laporan warga: terdengar 5 tembakan laras pendek.</p>
            <div class="mini-footer">
                <span class="mini-loc" id="miniLoc">Idlewood Gas Station</span>
                <button class="btn-mini-respond" id="btnMiniRespond">Tanggapi [G]</button>
            </div>
        </div>
    </div>

    <script src="../common/cef-bridge.js?v=1.0.4"></script>
    <script src="script.js?v=1.0.4"></script>
</body>
</html>
