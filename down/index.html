<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKRP - Down & Unconscious System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Screen Overlay Vignette and Pulse Effect -->
    <div class="down-vignette active" id="downVignette"></div>

    <!-- Main Down HUD Container -->
    <div class="down-container active" id="downContainer">
        
        <!-- Top Status Badge -->
        <div class="down-header glass-card">
            <div class="pulse-ring"></div>
            <div class="down-status-badge">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <span id="downConditionTitle">KONDISI KRITIS / TAK SADARKAN DIRI</span>
            </div>
            <div class="down-subtext" id="downConditionDesc">Detak jantung Anda melemah. Pertolongan medis segera dibutuhkan.</div>
        </div>

        <!-- Center Timer & Bleedout Card -->
        <div class="down-timer-card glass-card">
            <div class="timer-circular-wrap">
                <svg class="timer-svg" viewBox="0 0 120 120">
                    <circle class="timer-track" cx="60" cy="60" r="52"></circle>
                    <circle class="timer-progress" id="timerProgress" cx="60" cy="60" r="52"></circle>
                </svg>
                <div class="timer-inner-text">
                    <span class="timer-val" id="timerVal">05:00</span>
                    <span class="timer-lbl">SISA WAKTU</span>
                </div>
            </div>

            <div class="down-stats-grid">
                <div class="stat-box">
                    <span class="stat-label">STATUS DETAK</span>
                    <span class="stat-value pulse-text" id="pulseRate">42 BPM</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">MEDIS ON-DUTY</span>
                    <span class="stat-value" id="medicCount">3 Petugas</span>
                </div>
            </div>
        </div>

        <!-- Bottom Action Cards & Key Prompts -->
        <div class="down-actions-row">
            <!-- Action 1: Call 912 EMS Dispatch -->
            <button class="down-btn btn-ems" id="btnCallEMS">
                <div class="btn-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M19 10.5V6c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h1v3l3-3h8l4 3v-3h1c1.1 0 2-.9 2-2v-4.5zM11 13H9v2H7v-2H5v-2h2V9h2v2h2v2zm7-2h-3V7h3v4z"/>
                    </svg>
                </div>
                <div class="btn-text-wrap">
                    <span class="btn-key">[G]</span>
                    <span class="btn-title">Kirim Sinyal Darurat 912</span>
                    <span class="btn-sub" id="dispatchStatusText">Panggil Ambulans & Paramedis</span>
                </div>
            </button>

            <!-- Action 2: Respawn / Bleedout (Active only when timer hits 0) -->
            <button class="down-btn btn-respawn disabled" id="btnRespawn" disabled>
                <div class="btn-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                    </svg>
                </div>
                <div class="btn-text-wrap">
                    <span class="btn-key">[E]</span>
                    <span class="btn-title">Menyerah & Respawn</span>
                    <span class="btn-sub" id="respawnSubText">Tunggu hingga waktu habis</span>
                </div>
            </button>
        </div>

    </div>

    <!-- CefBridge Library -->
    <script src="../common/cef-bridge.js"></script>
    <script src="script.js"></script>
</body>
</html>
