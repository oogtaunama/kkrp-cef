<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKRP - Simple Orange Garage</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="garage-body" style="background: transparent !important; display: none;">

    <!-- Floating Simple Context Menu -->
    <div class="menu-wrapper" id="garageContainer" style="display: none;">
        
        <!-- Header -->
        <div class="menu-header">
            <div class="header-left">
                <i class="fa-solid fa-warehouse header-icon"></i>
                <div class="header-title-box">
                    <span class="header-title" id="garageTitle">GARASI KENDARAAN</span>
                    <span class="header-subtitle" id="garageSubtitle">Pilih kendaraan untuk dikeluarkan</span>
                </div>
            </div>
            <button type="button" class="btn-close" onclick="GarageApp.close()" title="Tutup (ESC)">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Vehicle List (Simple Cards matching reference) -->
        <div class="vehicle-list" id="vehicleList">
            <!-- Injected by script.js -->
        </div>

        <!-- Footer -->
        <div class="menu-footer">
            <span class="footer-hint"><kbd>ESC</kbd> Batal / Tutup</span>
            <span class="footer-count" id="totalCount">0 Unit</span>
        </div>
    </div>

    <!-- Simple Toast -->
    <div id="toast" class="garage-toast">
        <i class="fa-solid fa-circle-check" id="toastIcon"></i>
        <span id="toastMsg">Kendaraan dikeluarkan</span>
    </div>

    <!-- Scripts -->
    <script src="../common/cef-bridge.js"></script>
    <script src="script.js"></script>
</body>
</html>
