<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kota Kecilku - NoPixel 4.0 QB HUD</title>
    <!-- Common & HUD Stylesheets -->
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud-container">

        <!-- ============================================================ -->
        <!-- 1. HEXAGONAL STATUS HUD (HBE) - Tepat di BAWAH Minimap        -->
        <!-- Voice, Health, Armor, Food, Water, Stress, Sleep             -->
        <!-- ============================================================ -->
        <div class="nopixel-hbe-wrap" id="hbeHud">
            
            <!-- 1. VOICE / MIC -->
            <div class="hex-item voice active" id="hexVoice" title="Voice">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipVoice">
                            <rect id="rectVoice" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipVoice)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Mic Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                    </svg>
                </div>
            </div>

            <!-- 2. HEALTH / DARAH -->
            <div class="hex-item health" id="hexHealth" title="Darah">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipHealth">
                            <rect id="rectHealth" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipHealth)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Heart Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
            </div>

            <!-- 3. ARMOR / ROMPI -->
            <div class="hex-item armor" id="hexArmor" title="Armor">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipArmor">
                            <rect id="rectArmor" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipArmor)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Shield Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                    </svg>
                </div>
            </div>

            <!-- 4. FOOD / MAKANAN -->
            <div class="hex-item food" id="hexFood" title="Makan">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipFood">
                            <rect id="rectFood" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipFood)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Burger / Food Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21.9 12.2C21.4 6.8 17.2 4 12 4S2.6 6.8 2.1 12.2c-.1.8.6 1.8 1.5 1.8h16.8c.9 0 1.6-1 1.5-1.8zM4.1 12c.5-4.1 3.7-6 7.9-6s7.4 1.9 7.9 6H4.1zM3 16h18v2H3zm2 3h14c1.1 0 2-.9 2-2H3c0 1.1.9 2 2 2z"/>
                    </svg>
                </div>
            </div>

            <!-- 5. WATER / MINUMAN -->
            <div class="hex-item water" id="hexWater" title="Minum">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipWater">
                            <rect id="rectWater" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipWater)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Water Droplet Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                    </svg>
                </div>
            </div>

            <!-- 6. STRESS / STRES -->
            <div class="hex-item stress" id="hexStress" title="Stres">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipStress">
                            <rect id="rectStress" x="0" y="32" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipStress)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Brain / Pulse Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.57 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm-1-9h2v4h-2zm0 5h2v2h-2z"/>
                    </svg>
                </div>
            </div>

            <!-- 7. SLEEP / NGANTUK -->
            <div class="hex-item sleep" id="hexSleep" title="Ngantuk">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipSleep">
                            <rect id="rectSleep" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipSleep)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Moon / Sleep Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.3 2a10 10 0 0 0-.19 20 10 10 0 0 0 8.7-5.11 1 1 0 0 0-1.1-1.44 8 8 0 1 1-8.85-12.35 1 1 0 0 0 1.44-1.1z"/>
                    </svg>
                </div>
            </div>

        </div>

        <!-- ============================================================ -->
        <!-- 2. SPEEDOMETER (NoPixel 4.0 QB Style - Tepat di KANAN Map)    -->
        <!-- Sesuai referensi ref_hud_speedo.jpg                          -->
        <!-- ============================================================ -->
        <div class="speedo-wrapper" id="speedoHud" style="display: none;">
            <div class="speedo-card">
                
                <!-- Baris Atas: Seatbelt Icon (Kiri), KPH (Tengah), Fuel Icon (Kanan) -->
                <div class="speedo-top">
                    <!-- Seatbelt / Harness Icon -->
                    <div class="seatbelt-badge active" id="badgeBelt" title="Seatbelt">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                        </svg>
                    </div>

                    <div class="unit-text">KPH</div>

                    <!-- Fuel Pump Icon -->
                    <div class="fuel-badge" title="Fuel">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                            <path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33a2.5 2.5 0 0 0 2.5 2.5c.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                        </svg>
                    </div>
                </div>

                <!-- Baris Tengah: Gear Box (Kiri), 3-Digit Speed (Tengah), Vertical Fuel Gauge (Kanan) -->
                <div class="speedo-mid">
                    <!-- Kotak Gear Glowing Cyan -->
                    <div class="gear-box" id="gearBox">
                        <span class="gear-digit" id="gearVal">1</span>
                        <div class="gear-icon">
                            <svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor">
                                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.484.484 0 0 0 13.9 2h-3.8a.49.49 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.8c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                            </svg>
                        </div>
                    </div>

                    <!-- 3-Digit Digital Speed (000 format) -->
                    <div class="speed-nums" id="speedDisplay">
                        <span class="digit dim" id="d1">0</span>
                        <span class="digit dim" id="d2">0</span>
                        <span class="digit" id="d3">0</span>
                    </div>

                    <!-- Vertical Fuel Level Bar -->
                    <div class="fuel-track-vert" title="Fuel Level">
                        <div class="fuel-fill-vert" id="fuelFill" style="height: 100%;"></div>
                    </div>
                </div>

                <!-- Baris Bawah: Horizontal Segmented RPM Ticks (16 segmen) -->
                <div class="rpm-bar" id="rpmBar">
                    <span class="rpm-tick" data-i="0"></span>
                    <span class="rpm-tick" data-i="1"></span>
                    <span class="rpm-tick" data-i="2"></span>
                    <span class="rpm-tick" data-i="3"></span>
                    <span class="rpm-tick" data-i="4"></span>
                    <span class="rpm-tick" data-i="5"></span>
                    <span class="rpm-tick" data-i="6"></span>
                    <span class="rpm-tick" data-i="7"></span>
                    <span class="rpm-tick" data-i="8"></span>
                    <span class="rpm-tick" data-i="9"></span>
                    <span class="rpm-tick" data-i="10"></span>
                    <span class="rpm-tick" data-i="11"></span>
                    <span class="rpm-tick" data-i="12"></span>
                    <span class="rpm-tick" data-i="13"></span>
                    <span class="rpm-tick" data-i="14"></span>
                    <span class="rpm-tick" data-i="15"></span>
                </div>

            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="../common/cef-bridge.js"></script>
    <script src="script.js"></script>
</body>
</html>
