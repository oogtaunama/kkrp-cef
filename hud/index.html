<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kota Kecilku - Roleplay HUD</title>
    <!-- Common & Stylesheets -->
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud-container">

        <!-- ============================================================ -->
        <!-- 1. SERVER INFO & WEAPON HUD (Top-Right)                      -->
        <!-- Sesuai referensi media_1794483597194_c2c78f12.png             -->
        <!-- dan media_1794484266280_70b49703.png                         -->
        <!-- ============================================================ -->
        <div class="server-info-wrap" id="serverInfoHud">
            
            <!-- Baris 1: Jam/Tanggal (Kiri) & Logo + Nama Server (Kanan) -->
            <div class="server-top-row">
                <div class="server-datetime">
                    <div class="time-box">
                        <svg class="top-icon" viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/>
                        </svg>
                        <span id="hudTime">15:40</span>
                    </div>
                    <div class="date-box">
                        <svg class="top-icon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                            <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
                        </svg>
                        <span id="hudDate">22.11.2024</span>
                    </div>
                </div>

                <div class="server-branding">
                    <div class="logo-box">
                        <img src="logo.png" alt="Logo Kota Kecilku" class="server-logo-img">
                    </div>
                    <div class="brand-text">
                        <div class="server-title">Kota Kecilku</div>
                        <div class="server-subtitle">Roleplay</div>
                    </div>
                </div>
            </div>

            <!-- Baris 2: Player Identity Pills (Nama, ID, Job) -->
            <div class="server-pills-row">
                <div class="info-pill name-pill" id="pillName" title="Karakter">
                    <svg class="pill-icon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <span class="pill-text" id="hudPlayerName">Brenden Randall</span>
                </div>
                <div class="info-pill id-pill" id="pillId" title="ID Pemain">
                    <span class="pill-id-prefix">ID</span>
                    <span class="pill-id-val" id="hudPlayerId">452</span>
                </div>
                <div class="info-pill job-pill" id="pillJob" title="Pekerjaan / Pangkat">
                    <svg class="pill-icon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                        <path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/>
                    </svg>
                    <span class="pill-text" id="hudPlayerJob">Officer II</span>
                </div>
            </div>

            <!-- Baris 3: Financial Pills (Uang Cash & Bank) -->
            <div class="server-money-row">
                <div class="money-pill cash-pill" id="pillCash" title="Uang Tunai (Cash)">
                    <svg class="money-icon cash" viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                        <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                    </svg>
                    <span class="money-val cash" id="hudCash">$56,000,12</span>
                </div>
                <div class="money-pill bank-pill" id="pillBank" title="Saldo Bank">
                    <svg class="money-icon bank" viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                        <path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.1-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>
                    </svg>
                    <span class="money-val bank" id="hudBank">$56,000,12</span>
                </div>
            </div>

            <!-- Baris 4: MODERN WEAPON HUD (Muncul HANYA Jika Memegang Senjata - Sesuai Gambar 2) -->
            <div class="weapon-hud-wrap" id="weaponHud" style="display: none;">
                <div class="weapon-row-top">
                    <div class="weapon-name" id="weaponName">Assault SMG</div>
                    <div class="weapon-ammo-top"><span id="weaponTopAmmo">13</span>/</div>
                </div>
                <div class="weapon-row-bottom">
                    <div class="weapon-img-wrap" id="weaponIconWrap">
                        <img src="weapons/29.svg" alt="Weapon" id="weaponImg" class="weapon-img">
                    </div>
                    <div class="weapon-ammo-big" id="weaponBigAmmo">18</div>
                </div>
            </div>

        </div>

        <!-- ============================================================ -->
        <!-- 2. HEXAGONAL STATUS HUD (HBE) - Di Bawah Kiri Minimap         -->
        <!-- 7 Hexagons: Voice, Health, Armor, Food, Water, Stress, Sleep -->
        <!-- ============================================================ -->
        <div class="nopixel-hbe-wrap" id="hbeHud">
            
            <!-- 1. VOICE / MIC -->
            <div class="hex-item voice active" id="hexVoice" title="Voice">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipVoice">
                            <rect id="rectVoice" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipVoice)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Mic Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                    </svg>
                </div>
            </div>

            <!-- 2. HEALTH / DARAH -->
            <div class="hex-item health" id="hexHealth" title="Darah">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipHealth">
                            <rect id="rectHealth" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipHealth)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Heart Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
            </div>

            <!-- 3. ARMOR / ROMPI -->
            <div class="hex-item armor" id="hexArmor" title="Armor">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipArmor">
                            <rect id="rectArmor" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipArmor)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Shield Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                    </svg>
                </div>
            </div>

            <!-- 4. FOOD / MAKANAN -->
            <div class="hex-item food" id="hexFood" title="Makan">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipFood">
                            <rect id="rectFood" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipFood)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Burger / Food Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3c-4.41 0-8 2.69-8 6h16c0-3.31-3.59-6-8-6zm-8 8v1c0 .55.45 1 1 1h14c.55 0 1-.45 1-1v-1H4zm1 4c-.55 0-1 .45-1 1v2c0 1.66 3.58 3 8 3s8-1.34 8-3v-2c0-.55-.45-1-1-1H5z"/>
                    </svg>
                </div>
            </div>

            <!-- 5. WATER / MINUMAN -->
            <div class="hex-item water" id="hexWater" title="Minum">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipWater">
                            <rect id="rectWater" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipWater)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Water Droplet Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                    </svg>
                </div>
            </div>

            <!-- 6. STRESS / TINGKAT STRES -->
            <div class="hex-item stress" id="hexStress" title="Stress">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipStress">
                            <rect id="rectStress" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipStress)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Brain Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.59 10.56 20 12 20s2.78-.41 4.34-1.09l1.9 1.9c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41l-.62-1.79C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm-2 11h-2v-2h2v2zm0-4h-2V8h2v2zm4 4h-2v-2h2v2zm0-4h-2V8h2v2zm4 4h-2v-2h2v2zm0-4h-2V8h2v2z"/>
                    </svg>
                </div>
            </div>

            <!-- 7. SLEEP / NGANTUK -->
            <div class="hex-item sleep" id="hexSleep" title="Ngantuk">
                <div class="hex-shape">
                    <svg class="hex-svg" viewBox="0 0 28 32">
                        <polygon class="hex-bg" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                        <clipPath id="clipSleep">
                            <rect id="rectSleep" x="0" y="0" width="28" height="32" />
                        </clipPath>
                        <polygon class="hex-fill" points="14,1 27,8 27,24 14,31 1,24 1,8" clip-path="url(#clipSleep)" />
                        <polygon class="hex-border" points="14,1 27,8 27,24 14,31 1,24 1,8" />
                    </svg>
                    <!-- Zzz / Moon Icon -->
                    <svg class="hex-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.3 2a10 10 0 0 0-1.9 19.8 10 10 0 0 0 11.6-11.6A10 10 0 0 0 12.3 2z"/>
                    </svg>
                </div>
            </div>

        </div>

        <!-- ============================================================ -->
        <!-- 3. NOPIXEL 4.0 SPEEDOMETER (Di Sebelah KANAN Minimap)        -->
        <!-- Sesuai referensi ref_hud_speedo.jpg                          -->
        <!-- ============================================================ -->
        <div class="speedo-wrapper" id="speedoWrap" style="display: none;">
            <div class="speedo-card">
                
                <!-- Baris Atas: Seatbelt Icon, KM/H Unit, Fuel Pump Icon -->
                <div class="speedo-top">
                    <div class="seatbelt-badge" id="seatbeltBadge" title="Seatbelt">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                            <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
                        </svg>
                    </div>

                    <div class="unit-text">KM/H</div>

                    <div class="fuel-badge" id="fuelBadge" title="Fuel">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                            <path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33a2.5 2.5 0 0 0 2.5 2.5c.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                        </svg>
                    </div>
                </div>

                <!-- Baris Tengah: Gear Box (Kiri), 3-Digit Speed (Tengah), Vertical Fuel Gauge (Kanan) -->
                <div class="speedo-mid">
                    <!-- Kotak Gear Glowing Cyan -->
                    <div class="gear-box" id="gearBox">
                        <span class="gear-digit" id="gearVal">1</span>
                        <div class="gear-icon">
                            <svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor">
                                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.484.484 0 0 0 13.9 2h-3.8a.49.49 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.8c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                            </svg>
                        </div>
                    </div>

                    <!-- 3-Digit Digital Speed (000 format) -->
                    <div class="speed-nums" id="speedDisplay">
                        <span class="digit dim" id="d1">0</span>
                        <span class="digit dim" id="d2">0</span>
                        <span class="digit" id="d3">0</span>
                    </div>

                    <!-- Vertical Fuel Level Bar -->
                    <div class="fuel-track-vert" title="Fuel Level">
                        <div class="fuel-fill-vert" id="fuelFill" style="height: 100%;"></div>
                    </div>
                </div>

                <!-- Baris Bawah: Horizontal Segmented RPM Ticks (16 segmen) -->
                <div class="rpm-bar" id="rpmBar">
                    <span class="rpm-tick" data-i="0"></span>
                    <span class="rpm-tick" data-i="1"></span>
                    <span class="rpm-tick" data-i="2"></span>
                    <span class="rpm-tick" data-i="3"></span>
                    <span class="rpm-tick" data-i="4"></span>
                    <span class="rpm-tick" data-i="5"></span>
                    <span class="rpm-tick" data-i="6"></span>
                    <span class="rpm-tick" data-i="7"></span>
                    <span class="rpm-tick" data-i="8"></span>
                    <span class="rpm-tick" data-i="9"></span>
                    <span class="rpm-tick" data-i="10"></span>
                    <span class="rpm-tick" data-i="11"></span>
                    <span class="rpm-tick" data-i="12"></span>
                    <span class="rpm-tick" data-i="13"></span>
                    <span class="rpm-tick" data-i="14"></span>
                    <span class="rpm-tick" data-i="15"></span>
                </div>

            </div>
        </div>

        <!-- ============================================================ -->
        <!-- 4. FIVEM MODERN NOTIFICATION & INTERACTION SYSTEM            -->
        <!-- ============================================================ -->
        <div id="notification-container" class="fivem-notify-stack"></div>

    </div>

    <!-- Scripts -->
    <script src="../common/cef-bridge.js"></script>
    <script src="script.js"></script>
</body>
</html>
