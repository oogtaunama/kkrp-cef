<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kota Kecilku Roleplay - Circular HBE HUD</title>
    <!-- Common & Module Stylesheets -->
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud-container">
        
        <!-- ============================================================ -->
        <!-- BOTTOM CENTER CIRCULAR HBE HUD (FiveM Style Reference)       -->
        <!-- Darah, Armor, Makan, Minum, Stress, Ngantuk                 -->
        <!-- ============================================================ -->
        <div class="bottom-center-hud" id="mainHbeHud">
            
            <!-- 1. HEALTH / DARAH -->
            <div class="hud-circle-item health" id="itemHealth">
                <div class="circle-wrapper">
                    <svg class="circle-svg" viewBox="0 0 36 36">
                        <circle class="circle-bg" cx="18" cy="18" r="16"></circle>
                        <circle class="circle-progress" id="ringHealth" cx="18" cy="18" r="16"></circle>
                    </svg>
                    <!-- Heart Icon -->
                    <svg class="circle-icon" viewBox="0 0 24 24">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="#ff4757" stroke="none"/>
                    </svg>
                </div>
                <span class="hud-label">HEALTH</span>
            </div>

            <!-- 2. ARMOR / ROMPI -->
            <div class="hud-circle-item armor" id="itemArmor">
                <div class="circle-wrapper">
                    <svg class="circle-svg" viewBox="0 0 36 36">
                        <circle class="circle-bg" cx="18" cy="18" r="16"></circle>
                        <circle class="circle-progress" id="ringArmor" cx="18" cy="18" r="16"></circle>
                    </svg>
                    <!-- Shield Icon -->
                    <svg class="circle-icon" viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#1e90ff" stroke="none"/>
                    </svg>
                </div>
                <span class="hud-label">ARMOR</span>
            </div>

            <!-- 3. FOOD / MAKAN -->
            <div class="hud-circle-item food" id="itemFood">
                <div class="circle-wrapper">
                    <svg class="circle-svg" viewBox="0 0 36 36">
                        <circle class="circle-bg" cx="18" cy="18" r="16"></circle>
                        <circle class="circle-progress" id="ringFood" cx="18" cy="18" r="16"></circle>
                    </svg>
                    <!-- Burger / Food Icon -->
                    <svg class="circle-icon" viewBox="0 0 24 24" fill="none" stroke="#ffa502" stroke-width="2">
                        <path d="M3 11c0-3.3 3.6-6 9-6s9 2.7 9 6H3z"/>
                        <path d="M4 14h16"/>
                        <path d="M5 17h14c0 2.2-2.7 4-7 4s-7-1.8-7-4z"/>
                    </svg>
                </div>
                <span class="hud-label">FOOD</span>
            </div>

            <!-- 4. WATER / MINUM -->
            <div class="hud-circle-item water" id="itemWater">
                <div class="circle-wrapper">
                    <svg class="circle-svg" viewBox="0 0 36 36">
                        <circle class="circle-bg" cx="18" cy="18" r="16"></circle>
                        <circle class="circle-progress" id="ringWater" cx="18" cy="18" r="16"></circle>
                    </svg>
                    <!-- Water Droplet Icon -->
                    <svg class="circle-icon" viewBox="0 0 24 24">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" fill="#00d2d3" stroke="none"/>
                    </svg>
                </div>
                <span class="hud-label">WATER</span>
            </div>

            <!-- 5. STRESS -->
            <div class="hud-circle-item stress" id="itemStress">
                <div class="circle-wrapper">
                    <svg class="circle-svg" viewBox="0 0 36 36">
                        <circle class="circle-bg" cx="18" cy="18" r="16"></circle>
                        <circle class="circle-progress" id="ringStress" cx="18" cy="18" r="16"></circle>
                    </svg>
                    <!-- Brain / Pulse Icon -->
                    <svg class="circle-icon" viewBox="0 0 24 24" fill="none" stroke="#e056fd" stroke-width="2">
                        <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.04z"/>
                        <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.04z"/>
                    </svg>
                </div>
                <span class="hud-label">STRESS</span>
            </div>

            <!-- 6. SLEEPY / NGANTUK -->
            <div class="hud-circle-item sleep" id="itemSleep">
                <div class="circle-wrapper">
                    <svg class="circle-svg" viewBox="0 0 36 36">
                        <circle class="circle-bg" cx="18" cy="18" r="16"></circle>
                        <circle class="circle-progress" id="ringSleep" cx="18" cy="18" r="16"></circle>
                    </svg>
                    <!-- Moon Icon -->
                    <svg class="circle-icon" viewBox="0 0 24 24">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#f1c40f" stroke="none"/>
                    </svg>
                </div>
                <span class="hud-label">SLEEP</span>
            </div>

        </div>

        <!-- ============================================================ -->
        <!-- SPEEDOMETER (FiveM Style Above Bottom HUD)                    -->
        <!-- ============================================================ -->
        <div class="speedo-hud glass-panel" id="speedoHud" style="display: none;">
            <div class="speedo-main">
                <span class="speed-num" id="speedVal">0</span>
                <span class="speed-unit">KM/H</span>
            </div>
            <div class="speedo-meta">
                <div class="meta-item">
                    <span class="label">FUEL</span>
                    <span class="val fuel" id="fuelVal">100%</span>
                </div>
                <div class="meta-item">
                    <span class="label">GEAR</span>
                    <span class="val gear" id="gearVal">D</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="../common/cef-bridge.js"></script>
    <script src="script.js"></script>
</body>
</html>
