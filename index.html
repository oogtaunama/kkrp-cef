<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kota Kecilku Roleplay - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-header">
                <div class="brand-logo">
                    <!-- Icon SVG Server -->
                    <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <h1 class="server-title">KOTA KECILKU</h1>
                <p class="server-subtitle">ROLEPLAY INDONESIA</p>
                <div class="badge-season">#COMEBACK2026</div>
            </div>

            <div class="divider"></div>

            <div class="alert-box" id="alertBox">
                <span id="alertMsg">Pesan error</span>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); submitLogin();">
                <!-- Field UCP Name -->
                <div class="input-group">
                    <label for="ucpName">Nama UCP</label>
                    <div class="input-box read-only">
                        <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="ucpName" value="Loading..." readonly>
                    </div>
                </div>

                <!-- Field Password -->
                <div class="input-group">
                    <label for="password">Kata Sandi Akun</label>
                    <div class="input-box">
                        <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" placeholder="Masukkan password anda..." autofocus required autocomplete="off">
                        <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility()" title="Lihat password">
                            <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button type="button" class="btn btn-secondary" onclick="quitGame()">
                        Keluar
                    </button>
                    <button type="submit" class="btn btn-primary" id="btnLogin">
                        <span id="btnLoginText">Masuk Kota</span>
                        <div class="spinner" id="btnSpinner"></div>
                    </button>
                </div>
            </form>

            <div class="card-footer">
                <p>Lupa sandi? Hubungi Discord kami di <span>discord.gg/KotaKecilkurp</span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
