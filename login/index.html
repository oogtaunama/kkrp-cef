<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kota Kecilku Roleplay - Auth</title>
    
    <!-- Common & Module Stylesheets (Local/System Fonts for Instant Render) -->
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Overlay with Vignette (Subtle radial tint to preserve 3D world visibility) -->
    <div class="viewport-backdrop"></div>

    <!-- Alert / Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- MAIN APP CONTAINER -->
    <main class="app-container">
        
        <!-- ============================================================ -->
        <!-- VIEW 1: LOGIN SCREEN                                         -->
        <!-- ============================================================ -->
        <section class="auth-card glass-panel" id="viewLogin">
            <header class="brand-header">
                <div class="brand-icon-wrapper">
                    <!-- Modern Shield / City Emblem SVG -->
                    <svg class="brand-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
                <h1 class="brand-title">KOTA KECILKU</h1>
                <p class="brand-tagline">ROLEPLAY INDONESIA • OPEN.MP</p>
                <div class="brand-badge"><span>●</span> SERVER ONLINE</div>
            </header>

            <div class="card-divider"></div>

            <!-- Login Form -->
            <form id="formLogin" class="form-wrapper" autocomplete="off" onsubmit="event.preventDefault(); AuthApp.handleLogin();">
                <!-- Username / UCP Input (Readonly / Terkunci dari Game) -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="loginUcp" class="form-label">Nama Akun / UCP</label>
                        <span class="lock-badge">
                            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            TERKUNCI
                        </span>
                    </div>
                    <div class="input-wrapper read-only">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="loginUcp" class="form-input" value="Loading UCP..." readonly tabindex="-1">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="loginPass" class="form-label">Kata Sandi</label>
                    </div>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="loginPass" class="form-input" placeholder="Masukkan kata sandi..." required autofocus>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="btnQuit" onclick="AuthApp.handleQuit()">
                        Keluar
                    </button>
                    <button type="submit" class="btn btn-primary" id="btnLoginSubmit">
                        <span class="btn-text-content">Masuk Kota</span>
                        <div class="btn-spinner"></div>
                    </button>
                </div>
            </form>
        </section>

    </main>

    <!-- Load CEF Bridge & Main Logic Scripts -->
    <script src="../common/cef-bridge.js"></script>
    <script src="script.js"></script>
</body>
</html>
