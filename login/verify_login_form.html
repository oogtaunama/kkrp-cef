<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Kota Kecilku - Login & Register</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- YouTube Iframe API untuk Musik Lil Tatang - Kau Dan Basuri -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF7A18',
                            light: '#FFB347',
                            dark: '#111113'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            user-select: none;
            -webkit-user-drag: none;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0a0e;
            color: #f4f4f5;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Clean Matte Dark Glass Card */
        .cef-card {
            background: rgba(16, 16, 19, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 122, 24, 0.08);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Locked Account Input */
        .field-locked {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #a1a1aa;
            cursor: not-allowed;
        }

        /* Form Inputs */
        .field-input {
            background: rgba(9, 9, 11, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.11);
            color: #ffffff;
            transition: all 0.18s ease;
        }

        .field-input:focus {
            outline: none;
            border-color: #FF7A18;
            background: rgba(9, 9, 11, 0.92);
            box-shadow: 0 0 0 3px rgba(255, 122, 24, 0.16);
        }

        /* Warm Orange Buttons */
        .btn-orange {
            background: linear-gradient(135deg, #FF7A18 0%, #FF9B3D 100%);
            color: #ffffff;
            box-shadow: 0 6px 20px -4px rgba(255, 122, 24, 0.45);
            transition: all 0.18s ease;
        }

        .btn-orange:hover:not(:disabled) {
            filter: brightness(1.07);
            box-shadow: 0 8px 24px -3px rgba(255, 122, 24, 0.6);
            transform: translateY(-1px);
        }

        .btn-orange:active:not(:disabled) {
            transform: translateY(0) scale(0.99);
        }

        .btn-orange:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Mode Switch Tabs */
        .tab-btn {
            transition: all 0.2s ease;
            color: #a1a1aa;
        }
        .tab-btn.active {
            color: #ffffff;
            background: #FF7A18;
            box-shadow: 0 2px 10px rgba(255, 122, 24, 0.4);
            font-weight: 700;
        }

        /* Redesigned Music Switch Widget */
        .audio-dock {
            background: rgba(15, 15, 18, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .audio-dock.is-playing {
            border-color: rgba(255, 122, 24, 0.4);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 0 20px rgba(255, 122, 24, 0.14);
        }

        /* Animated Equalizer Bars */
        .eq-bar {
            width: 2.5px;
            background: #52525b;
            border-radius: 99px;
            height: 4px;
            transition: background-color 0.2s ease, height 0.2s ease;
        }

        .is-playing .eq-bar {
            background: linear-gradient(to top, #FF7A18, #FFB347);
            animation: eqBounce 0.75s ease-in-out infinite alternate;
        }

        .is-playing .eq-bar:nth-child(1) { animation-delay: 0.0s; animation-duration: 0.55s; }
        .is-playing .eq-bar:nth-child(2) { animation-delay: 0.18s; animation-duration: 0.75s; }
        .is-playing .eq-bar:nth-child(3) { animation-delay: 0.08s; animation-duration: 0.48s; }
        .is-playing .eq-bar:nth-child(4) { animation-delay: 0.25s; animation-duration: 0.68s; }

        @keyframes eqBounce {
            0% { height: 4px; }
            100% { height: 15px; }
        }

        /* Sliding Switch Track & Thumb */
        .switch-track {
            width: 38px;
            height: 20px;
            border-radius: 999px;
            background: #27272a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            transition: background-color 0.22s ease, border-color 0.22s ease;
        }

        .is-playing .switch-track {
            background: rgba(255, 122, 24, 0.25);
            border-color: #FF7A18;
        }

        .switch-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #71717a;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.22s ease, box-shadow 0.22s ease;
        }

        .is-playing .switch-thumb {
            transform: translateX(18px);
            background: #FF7A18;
            box-shadow: 0 0 8px #FF7A18;
        }

        /* Error Shake */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.25s ease-in-out;
        }

        /* Cinematic Slow Camera Pan (ENB / RenderHook Sunset Feel) */
        @keyframes cinematicCamera {
            0% {
                transform: scale(1.04) translate3d(0%, 0%, 0);
            }
            50% {
                transform: scale(1.09) translate3d(-1.2%, -0.6%, 0);
            }
            100% {
                transform: scale(1.04) translate3d(0%, 0%, 0);
            }
        }

        .cinematic-pan {
            animation: cinematicCamera 38s ease-in-out infinite;
            will-change: transform;
        }

        /* Smooth card entrance */
        .card-enter {
            animation: cardFadeIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative select-none">

    <!-- =========================================================================
         HD SANTA MARIA BEACH LIGHTHOUSE (MERCUSUAR LOS SANTOS) AT GOLDEN HOUR
         Photographic HD Layer + Volumetric Lighthouse Beam + Realistic Flying Birds
         ========================================================================= -->
    <div id="bg-wrapper" class="fixed inset-0 z-0 overflow-hidden pointer-events-none bg-[#0d0907]">
        
        <!-- 1. Moving Camera Container (Photographic HD Coastal Lighthouse) -->
        <div class="absolute inset-0 cinematic-pan">
            <img
                id="bg-photo"
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=90"
                alt="Santa Maria Beach Sunset"
                class="absolute inset-0 w-full h-full object-cover opacity-35"
            >
            <img
                id="bg-lighthouse-photo"
                src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=2000&q=85"
                alt="Ocean Waves"
                class="absolute inset-0 w-full h-full object-cover mix-blend-overlay opacity-45"
            >

            <!-- Video Layer (Optional custom server clip) -->
            <video
                id="bg-video"
                autoplay
                loop
                muted
                playsinline
                class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-700"
            ></video>
        </div>

        <!-- 2. 60FPS Realistic Atmospheric Canvas (HD Santa Maria Lighthouse, Volumetric Beam, Birds & Shimmer) -->
        <canvas id="gta-scenery-canvas" class="absolute inset-0 w-full h-full object-cover"></canvas>

        <!-- 3. Authentic ENB Golden Hour Color Grading & Subtle Vignette -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/40"></div>
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_25%,rgba(8,6,5,0.72)_100%)]"></div>
    </div>

    <!-- =========================================================================
         AUDIO SOURCE (music.mp3 dengan fallback synth akord hangat matahari terbenam)
         ========================================================================= -->
    <audio id="bg-music" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- =========================================================================
         PRELOADING STATE (5-8 Detik: Tanpa GUI Kaku, Bersih & Sinematik)
         Mengunduh semua aset modul CEF lain (HUD, Char, Inventory, Target)
         di latar belakang agar game lancar bebas patah-patah!
         ========================================================================= -->
    <div id="preloading-container" class="fixed bottom-10 inset-x-0 z-10 flex flex-col items-center justify-center pointer-events-none transition-all duration-700">
        <div class="flex items-center gap-3 px-5 py-2 rounded-full bg-black/60 backdrop-blur-xl border border-white/10 shadow-2xl">
            <span class="relative flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-orange opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand-orange"></span>
            </span>
            <span id="preload-status-label" class="text-[11px] font-semibold tracking-wider text-zinc-300 uppercase">
                Menyiapkan Kota Kecilku...
            </span>
            <span id="preload-percent" class="text-[11px] font-mono font-bold text-brand-light">
                0%
            </span>
        </div>
        <div class="w-56 h-[3px] bg-white/10 rounded-full mt-2.5 overflow-hidden shadow-inner">
            <div id="preload-progress-bar" class="h-full bg-gradient-to-r from-brand-orange via-brand-light to-brand-orange transition-all duration-300 w-0"></div>
        </div>
    </div>

    <!-- =========================================================================
         CENTER CARD (Mendukung LOGIN & REGISTER dengan Transisi Halus)
         Awalnya tersembunyi selama 5-8 detik preloading aset CEF selesai
         ========================================================================= -->
    <main id="auth-main-wrap" class="relative z-10 w-full max-w-[370px] px-4 opacity-0 pointer-events-none transition-all duration-700">
        <div id="auth-card" class="cef-card rounded-2xl p-6 relative overflow-hidden">
            
            <!-- Top Orange Accent Line -->
            <div class="absolute top-0 inset-x-0 h-[3px] bg-gradient-to-r from-brand-orange via-brand-light to-brand-orange"></div>

            <!-- Header (Tanpa Tab Switcher - Pemain Tidak Bisa Beralih Manual) -->
            <div class="mb-4">
                <h1 id="card-title" class="font-heading font-extrabold text-lg text-white tracking-tight">
                    Login Akun
                </h1>
                <p id="card-desc" class="text-xs text-zinc-400 mt-0.5">
                    Masukkan kata sandi akun Anda untuk masuk.
                </p>
            </div>

            <!-- FORM LOGIN (Hanya Tampil Jika UCP Sudah Terdaftar) -->
            <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-3.5">
                
                <!-- Account Name (Locked & Synced from CEF) -->
                <div>
                    <label class="block text-[11px] font-medium text-zinc-400 mb-1">
                        Nama Akun / UCP
                    </label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-user-lock absolute left-3.5 text-zinc-500 text-xs pointer-events-none"></i>
                        <input
                            id="login-account-name"
                            type="text"
                            value="Player_Satu"
                            readonly
                            disabled
                            tabindex="-1"
                            class="field-locked w-full pl-9 pr-3.5 py-2.5 rounded-xl text-sm font-medium focus:outline-none"
                        >
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="login-password" class="block text-[11px] font-medium text-zinc-400 mb-1">
                        Kata Sandi
                    </label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-lock absolute left-3.5 text-zinc-500 text-xs pointer-events-none"></i>
                        <input
                            id="login-password"
                            type="password"
                            required
                            autocomplete="off"
                            placeholder="Masukkan kata sandi..."
                            class="field-input w-full pl-9 pr-10 py-2.5 rounded-xl text-sm placeholder-zinc-600"
                        >
                        <button
                            type="button"
                            onclick="togglePasswordVisibility('login-password', 'eye-login-icon')"
                            tabindex="-1"
                            class="absolute right-3 text-zinc-500 hover:text-zinc-300 transition p-1 cursor-pointer"
                        >
                            <i id="eye-login-icon" class="fa-regular fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-1.5 flex gap-2">
                    <button
                        type="button"
                        onclick="handleQuitGame()"
                        class="px-3.5 py-2.5 rounded-xl text-xs font-semibold text-zinc-400 bg-white/5 hover:bg-white/10 hover:text-white border border-white/5 transition cursor-pointer"
                        title="Keluar dari Server"
                    >
                        Keluar
                    </button>
                    <button
                        id="submit-login-btn"
                        type="submit"
                        class="btn-orange flex-1 py-2.5 rounded-xl font-semibold text-sm tracking-wide flex items-center justify-center gap-2 cursor-pointer"
                    >
                        <span id="btn-login-label">MASUK KOTA</span>
                    </button>
                </div>
            </form>

            <!-- FORM REGISTER (Format Lama: UCP Terkunci, Code/PIN Discord, Password Baru & Konfirmasi) -->
            <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-3 hidden">
                
                <!-- Account Name (Locked & Synced from CEF) -->
                <div>
                    <label class="block text-[11px] font-medium text-zinc-400 mb-1">
                        Nama Akun / UCP
                    </label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-user-plus absolute left-3.5 text-zinc-500 text-xs pointer-events-none"></i>
                        <input
                            id="register-account-name"
                            type="text"
                            value="Player_Satu"
                            readonly
                            disabled
                            tabindex="-1"
                            class="field-locked w-full pl-9 pr-3.5 py-2 rounded-xl text-sm font-medium focus:outline-none"
                        >
                    </div>
                </div>

                <!-- Kode Verifikasi / PIN Discord (code) -->
                <div>
                    <label for="register-verify-code" class="block text-[11px] font-medium text-zinc-400 mb-1">
                        Kode Verifikasi Discord / PIN <span class="text-zinc-500 text-[10px]">(Format Angka)</span>
                    </label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-hashtag absolute left-3.5 text-zinc-500 text-xs pointer-events-none"></i>
                        <input
                            id="register-verify-code"
                            type="text"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            required
                            autocomplete="off"
                            placeholder="Masukkan kode PIN Discord..."
                            class="field-input w-full pl-9 pr-3.5 py-2 rounded-xl text-sm placeholder-zinc-600 font-mono tracking-wider"
                        >
                    </div>
                </div>

                <!-- New Password Input (pw) -->
                <div>
                    <label for="register-password" class="block text-[11px] font-medium text-zinc-400 mb-1">
                        Kata Sandi Baru <span class="text-zinc-500 text-[10px]">(7-32 Karakter)</span>
                    </label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-key absolute left-3.5 text-zinc-500 text-xs pointer-events-none"></i>
                        <input
                            id="register-password"
                            type="password"
                            required
                            minlength="7"
                            maxlength="32"
                            autocomplete="off"
                            placeholder="Buat kata sandi baru..."
                            class="field-input w-full pl-9 pr-10 py-2 rounded-xl text-sm placeholder-zinc-600"
                        >
                        <button
                            type="button"
                            onclick="togglePasswordVisibility('register-password', 'eye-reg1-icon')"
                            tabindex="-1"
                            class="absolute right-3 text-zinc-500 hover:text-zinc-300 transition p-1 cursor-pointer"
                        >
                            <i id="eye-reg1-icon" class="fa-regular fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Input (pw) -->
                <div>
                    <label for="register-confirm-password" class="block text-[11px] font-medium text-zinc-400 mb-1">
                        Konfirmasi Kata Sandi
                    </label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-shield-halved absolute left-3.5 text-zinc-500 text-xs pointer-events-none"></i>
                        <input
                            id="register-confirm-password"
                            type="password"
                            required
                            minlength="7"
                            maxlength="32"
                            autocomplete="off"
                            placeholder="Ulangi kata sandi..."
                            class="field-input w-full pl-9 pr-10 py-2 rounded-xl text-sm placeholder-zinc-600"
                        >
                        <button
                            type="button"
                            onclick="togglePasswordVisibility('register-confirm-password', 'eye-reg2-icon')"
                            tabindex="-1"
                            class="absolute right-3 text-zinc-500 hover:text-zinc-300 transition p-1 cursor-pointer"
                        >
                            <i id="eye-reg2-icon" class="fa-regular fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-1.5 flex gap-2">
                    <button
                        type="button"
                        onclick="handleQuitGame()"
                        class="px-3.5 py-2.5 rounded-xl text-xs font-semibold text-zinc-400 bg-white/5 hover:bg-white/10 hover:text-white border border-white/5 transition cursor-pointer"
                        title="Keluar dari Server"
                    >
                        Keluar
                    </button>
                    <button
                        id="submit-register-btn"
                        type="submit"
                        class="btn-orange flex-1 py-2.5 rounded-xl font-semibold text-sm tracking-wide flex items-center justify-center gap-2 cursor-pointer"
                    >
                        <span id="btn-register-label">DAFTAR SEKARANG</span>
                    </button>
                </div>
            </form>

            <!-- Error / Success Alert Box -->
            <div id="alert-box" class="hidden mt-3 rounded-xl px-3 py-2 text-xs flex items-center gap-2">
                <i id="alert-icon" class="fa-solid shrink-0 text-xs"></i>
                <span id="alert-text">Pesan informasi.</span>
            </div>

        </div>
    </main>

    <!-- =========================================================================
         BOTTOM-LEFT MUSIC ON/OFF SWITCH WIDGET (Lil Tatang - Kau Dan Basuri)
         ========================================================================= -->
    <div class="fixed bottom-5 left-5 z-20">
        <div
            id="music-widget"
            onclick="toggleMusic()"
            role="switch"
            aria-checked="true"
            class="audio-dock is-playing rounded-xl px-3.5 py-2.5 flex items-center gap-3.5 cursor-pointer group"
            title="Klik untuk mematikan / menyalakan musik"
        >
            <!-- Speaker Icon -->
            <div class="w-8 h-8 rounded-lg bg-white/[0.04] border border-white/[0.08] flex items-center justify-center text-brand-orange group-hover:text-brand-light transition-colors">
                <i id="speaker-icon" class="fa-solid fa-volume-high text-xs text-brand-orange"></i>
            </div>

            <!-- Equalizer Status -->
            <div class="flex flex-col pr-1">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-zinc-200 tracking-tight">
                        Lil Tatang - Kau Dan Basuri
                    </span>
                    <div class="flex items-end gap-[2px] h-3">
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                        <span class="eq-bar"></span>
                    </div>
                </div>
                <span id="music-state-text" class="text-[10px] font-medium text-brand-light leading-none mt-1 transition-colors">
                    ON â€¢ Otomatis Memutar
                </span>
            </div>

            <!-- Sliding Switch -->
            <div class="switch-track">
                <div class="switch-thumb"></div>
            </div>
        </div>
    </div>

    <!-- Hidden YouTube Player Container (Lil Tatang - Kau Dan Basuri: zwKyJRI8Unc) -->
    <div id="yt-player-container" style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; left:-9999px; top:-9999px;">
        <div id="yt-player"></div>
    </div>

    <!-- Hidden Preload Container for background CEF pages -->
    <div id="cef-preload-vault" style="position: absolute; width: 0; height: 0; border: 0; visibility: hidden; pointer-events: none; left: -9999px; top: -9999px;"></div>

    <!-- =========================================================================
         SCRIPTS: HD SANTA MARIA LIGHTHOUSE & BIRDS, CEF PRELOADER & AUTH HANDLERS
         ========================================================================= -->
    <script>
        /* -----------------------------------------------------------------------
           1. HD LOS SANTOS SANTA MARIA BEACH LIGHTHOUSE & BIRDS (60 FPS)
           ----------------------------------------------------------------------- */
        (function initSantaMariaLighthouseScene() {
            const canvas = document.getElementById('gta-scenery-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, dpr;
            let time = 0;

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resize);
            resize();

            const birds = [];
            function createBird(initialRandomX = true) {
                const depth = Math.random();
                const scale = 0.45 + depth * 0.85;
                const direction = 1;
                const startX = initialRandomX ? Math.random() * width : -60 - Math.random() * 250;
                const startY = height * (0.12 + Math.random() * 0.36);

                return {
                    x: startX,
                    y: startY,
                    baseY: startY,
                    vx: (0.65 + depth * 1.15) * direction,
                    vy: (Math.random() - 0.5) * 0.18,
                    scale: scale,
                    wingPhase: Math.random() * Math.PI * 2,
                    wingSpeed: 0.09 + (1 - depth * 0.3) * 0.06,
                    glideTimer: Math.random() * 200,
                    opacity: 0.45 + depth * 0.45
                };
            }

            for (let i = 0; i < 16; i++) {
                birds.push(createBird(true));
            }

            const mistParticles = Array.from({ length: 35 }, () => ({
                x: Math.random() * 2000,
                y: Math.random() * 1000,
                r: 0.8 + Math.random() * 1.8,
                vx: 0.15 + Math.random() * 0.3,
                vy: -0.05 + Math.random() * 0.1,
                alpha: 0.12 + Math.random() * 0.28
            }));

            const shimmerWaves = Array.from({ length: 42 }, (_, i) => ({
                offset: i / 42,
                phase: Math.random() * Math.PI * 2,
                speed: 0.8 + Math.random() * 1.2,
                widthFactor: 0.4 + Math.random() * 0.6
            }));

            function drawRealisticBird(b) {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.scale(b.scale, b.scale);

                b.glideTimer += 1;
                const isGliding = Math.sin(b.glideTimer * 0.025) > 0.65;
                if (!isGliding) {
                    b.wingPhase += b.wingSpeed;
                } else {
                    b.wingPhase += (0.2 - Math.sin(b.wingPhase)) * 0.05;
                }

                const flap = Math.sin(b.wingPhase);
                const tipFlap = Math.sin(b.wingPhase - 0.55);
                const elbowY = -flap * 5.5;
                const tipY = -tipFlap * 9.5 + (flap > 0 ? 1.5 : -1.0);
                const bodyBob = flap * 0.9;

                ctx.strokeStyle = `rgba(22, 13, 10, ${b.opacity})`;
                ctx.fillStyle = `rgba(22, 13, 10, ${b.opacity})`;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(0, bodyBob);
                ctx.quadraticCurveTo(-7, elbowY, -14, elbowY * 0.85);
                ctx.quadraticCurveTo(-19, (elbowY + tipY) * 0.5, -24, tipY);
                ctx.quadraticCurveTo(-17, elbowY + 1.8, -8, elbowY + 2.1);
                ctx.quadraticCurveTo(-3, bodyBob + 1.4, 0, bodyBob + 1.2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, bodyBob);
                ctx.quadraticCurveTo(6, elbowY * 0.9, 12, elbowY * 0.75);
                ctx.quadraticCurveTo(16, (elbowY + tipY) * 0.45, 20, tipY * 0.88);
                ctx.quadraticCurveTo(14, elbowY + 1.5, 7, elbowY + 1.8);
                ctx.quadraticCurveTo(2, bodyBob + 1.3, 0, bodyBob + 1.2);
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(0.5, bodyBob + 0.6, 2.6, 1.0, -0.15, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function drawSantaMariaLighthouse(horizonY) {
                const cliffBaseX = width * 0.78;
                const lighthouseX = width * 0.805;
                const cliffTopY = horizonY - height * 0.045;
                const towerHeight = Math.min(width, height) * 0.21;
                const towerTopY = cliffTopY - towerHeight;
                const baseHalfW = towerHeight * 0.145;
                const topHalfW = towerHeight * 0.088;

                // Far Pier & Ferris Wheel
                ctx.save();
                ctx.fillStyle = 'rgba(20, 12, 11, 0.82)';
                ctx.beginPath();
                ctx.moveTo(0, horizonY + 4);
                ctx.lineTo(0, horizonY - 12);
                ctx.lineTo(width * 0.18, horizonY - 9);
                ctx.lineTo(width * 0.31, horizonY - 3);
                ctx.lineTo(width * 0.31, horizonY + 4);
                ctx.closePath();
                ctx.fill();

                const pierEnd = width * 0.31;
                ctx.strokeStyle = 'rgba(24, 14, 12, 0.65)';
                ctx.lineWidth = 1.2;
                for (let px = width * 0.16; px < pierEnd; px += 9) {
                    ctx.beginPath();
                    ctx.moveTo(px, horizonY - 4);
                    ctx.lineTo(px, horizonY + 5);
                    ctx.stroke();
                }

                const wheelX = width * 0.245;
                const wheelY = horizonY - 22;
                const wheelR = 14;
                ctx.strokeStyle = 'rgba(35, 19, 15, 0.55)';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.arc(wheelX, wheelY, wheelR, 0, Math.PI * 2);
                ctx.stroke();
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                    ctx.beginPath();
                    ctx.moveTo(wheelX, wheelY);
                    ctx.lineTo(wheelX + Math.cos(a + time * 0.15) * wheelR, wheelY + Math.sin(a + time * 0.15) * wheelR);
                    ctx.stroke();
                }
                ctx.restore();

                // Volumetric Beam
                const lanternY = towerTopY - towerHeight * 0.08;
                const beamAngle = Math.sin(time * 0.55) * 0.22 - 0.06;
                const beamSpread = 0.095 + Math.sin(time * 1.1) * 0.015;
                const beamLength = width * 0.75;

                ctx.save();
                ctx.translate(lighthouseX, lanternY);
                ctx.rotate(beamAngle);

                const leftBeamGrad = ctx.createLinearGradient(0, 0, -beamLength, 0);
                leftBeamGrad.addColorStop(0, 'rgba(255, 228, 150, 0.42)');
                leftBeamGrad.addColorStop(0.18, 'rgba(255, 175, 75, 0.18)');
                leftBeamGrad.addColorStop(0.55, 'rgba(255, 135, 45, 0.05)');
                leftBeamGrad.addColorStop(1, 'rgba(255, 120, 30, 0)');

                ctx.fillStyle = leftBeamGrad;
                ctx.beginPath();
                ctx.moveTo(0, -3);
                ctx.lineTo(-beamLength, -beamLength * beamSpread);
                ctx.lineTo(-beamLength, beamLength * beamSpread);
                ctx.lineTo(0, 3);
                ctx.closePath();
                ctx.fill();

                const rightBeamGrad = ctx.createLinearGradient(0, 0, beamLength * 0.45, 0);
                rightBeamGrad.addColorStop(0, 'rgba(255, 228, 150, 0.35)');
                rightBeamGrad.addColorStop(0.4, 'rgba(255, 165, 65, 0.10)');
                rightBeamGrad.addColorStop(1, 'rgba(255, 120, 30, 0)');

                ctx.fillStyle = rightBeamGrad;
                ctx.beginPath();
                ctx.moveTo(0, -3);
                ctx.lineTo(beamLength * 0.45, -beamLength * 0.45 * beamSpread);
                ctx.lineTo(beamLength * 0.45, beamLength * 0.45 * beamSpread);
                ctx.lineTo(0, 3);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                // Tower
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(lighthouseX - baseHalfW, cliffTopY + 6);
                ctx.lineTo(lighthouseX - topHalfW, towerTopY);
                ctx.lineTo(lighthouseX + topHalfW, towerTopY);
                ctx.lineTo(lighthouseX + baseHalfW, cliffTopY + 6);
                ctx.closePath();

                const towerGrad = ctx.createLinearGradient(
                    lighthouseX - baseHalfW,
                    towerTopY,
                    lighthouseX + baseHalfW,
                    towerTopY
                );
                towerGrad.addColorStop(0, '#ffae52');
                towerGrad.addColorStop(0.14, '#7a3b24');
                towerGrad.addColorStop(0.42, '#241412');
                towerGrad.addColorStop(1, '#0e0909');
                ctx.fillStyle = towerGrad;
                ctx.fill();

                // Railing & Lantern Room
                const galleryW = topHalfW * 1.38;
                const galleryH = towerHeight * 0.032;
                ctx.fillStyle = '#120b0a';
                ctx.fillRect(lighthouseX - galleryW, towerTopY - galleryH, galleryW * 2, galleryH);

                const lanternW = topHalfW * 0.78;
                const lanternH = towerHeight * 0.13;
                const lanternTopY = towerTopY - galleryH - lanternH;

                const glassGrad = ctx.createLinearGradient(
                    lighthouseX - lanternW,
                    lanternTopY,
                    lighthouseX + lanternW,
                    lanternTopY
                );
                glassGrad.addColorStop(0, 'rgba(255, 230, 150, 0.95)');
                glassGrad.addColorStop(0.5, 'rgba(255, 175, 70, 0.85)');
                glassGrad.addColorStop(1, 'rgba(120, 55, 25, 0.75)');
                ctx.fillStyle = glassGrad;
                ctx.fillRect(lighthouseX - lanternW, lanternTopY, lanternW * 2, lanternH);

                // Beacon Glow Core
                const pulse = 0.88 + Math.sin(time * 2.2) * 0.12;
                const coreGlow = ctx.createRadialGradient(
                    lighthouseX,
                    lanternY,
                    1,
                    lighthouseX,
                    lanternY,
                    towerHeight * 0.48 * pulse
                );
                coreGlow.addColorStop(0, 'rgba(255, 250, 220, 1)');
                coreGlow.addColorStop(0.18, 'rgba(255, 195, 95, 0.68)');
                coreGlow.addColorStop(0.5, 'rgba(255, 125, 30, 0.18)');
                coreGlow.addColorStop(1, 'rgba(255, 100, 20, 0)');
                ctx.fillStyle = coreGlow;
                ctx.beginPath();
                ctx.arc(lighthouseX, lanternY, towerHeight * 0.48 * pulse, 0, Math.PI * 2);
                ctx.fill();

                // Cliff Headland
                const houseW = towerHeight * 0.34;
                const houseH = towerHeight * 0.16;
                const cliffGrad = ctx.createLinearGradient(cliffBaseX - 120, cliffTopY, width, height);
                cliffGrad.addColorStop(0, '#1e110e');
                cliffGrad.addColorStop(0.3, '#120a09');
                cliffGrad.addColorStop(1, '#070505');

                ctx.fillStyle = cliffGrad;
                ctx.beginPath();
                ctx.moveTo(width * 0.56, horizonY + (height - horizonY) * 0.28);
                ctx.quadraticCurveTo(width * 0.63, horizonY + 8, width * 0.68, cliffTopY + 26);
                ctx.quadraticCurveTo(width * 0.73, cliffTopY + 6, lighthouseX - baseHalfW - 14, cliffTopY + 3);
                ctx.lineTo(lighthouseX + baseHalfW + houseW + 25, cliffTopY + 6);
                ctx.quadraticCurveTo(width * 0.94, cliffTopY - 4, width + 10, cliffTopY - 12);
                ctx.lineTo(width + 10, height + 10);
                ctx.lineTo(width * 0.48, height + 10);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            function render() {
                time += 0.016;
                const horizonY = height * 0.66;
                ctx.clearRect(0, 0, width, height);

                // Sky Gradient
                const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
                skyGrad.addColorStop(0, 'rgba(18, 13, 22, 0.78)');
                skyGrad.addColorStop(0.32, 'rgba(68, 29, 28, 0.62)');
                skyGrad.addColorStop(0.68, 'rgba(186, 78, 28, 0.58)');
                skyGrad.addColorStop(0.92, 'rgba(245, 138, 44, 0.68)');
                skyGrad.addColorStop(1, 'rgba(255, 185, 85, 0.78)');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, width, horizonY);

                // Setting Sun
                const sunX = width * 0.34;
                const sunY = horizonY - height * 0.035;
                const sunR = Math.min(width, height) * 0.09;

                const sunAtmosphericGlow = ctx.createRadialGradient(sunX, sunY, sunR * 0.1, sunX, sunY, sunR * 4.2);
                sunAtmosphericGlow.addColorStop(0, 'rgba(255, 245, 200, 0.92)');
                sunAtmosphericGlow.addColorStop(0.18, 'rgba(255, 190, 95, 0.65)');
                sunAtmosphericGlow.addColorStop(0.48, 'rgba(255, 115, 35, 0.24)');
                sunAtmosphericGlow.addColorStop(1, 'rgba(255, 85, 15, 0)');
                ctx.fillStyle = sunAtmosphericGlow;
                ctx.beginPath();
                ctx.arc(sunX, sunY, sunR * 4.2, 0, Math.PI * 2);
                ctx.fill();

                // Ocean Water
                const oceanGrad = ctx.createLinearGradient(0, horizonY, 0, height);
                oceanGrad.addColorStop(0, 'rgba(65, 28, 18, 0.84)');
                oceanGrad.addColorStop(0.25, 'rgba(32, 15, 14, 0.90)');
                oceanGrad.addColorStop(0.65, 'rgba(15, 9, 10, 0.95)');
                oceanGrad.addColorStop(1, 'rgba(7, 5, 6, 0.98)');
                ctx.fillStyle = oceanGrad;
                ctx.fillRect(0, horizonY, width, height - horizonY);

                // Ocean Sun Shimmer
                shimmerWaves.forEach((w) => {
                    const yProgress = Math.pow(w.offset, 1.35);
                    const wy = horizonY + 3 + yProgress * (height - horizonY) * 0.85;
                    const spreadW = (28 + yProgress * 220) * w.widthFactor;
                    const driftX = Math.sin(time * w.speed + w.phase) * (10 + yProgress * 25);
                    const wx = sunX - spreadW * 0.5 + driftX;
                    const alpha = (1 - yProgress * 0.75) * (0.18 + 0.14 * Math.sin(time * 2.4 + w.phase));

                    ctx.fillStyle = `rgba(255, 195, 105, ${alpha.toFixed(3)})`;
                    ctx.beginPath();
                    ctx.roundRect(wx, wy, spreadW, 1.4 + yProgress * 2.2, 4);
                    ctx.fill();
                });

                // Lighthouse & Birds
                drawSantaMariaLighthouse(horizonY);

                birds.forEach((b, idx) => {
                    b.x += b.vx;
                    b.y += b.vy + Math.sin(time * 1.2 + idx) * 0.08;
                    if (b.x > width + 80) Object.assign(b, createBird(false));
                    drawRealisticBird(b);
                });

                // Mist particles
                mistParticles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    ctx.fillStyle = `rgba(255, 195, 120, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                requestAnimationFrame(render);
            }

            render();
        })();

        /* -----------------------------------------------------------------------
           2. CEF PRELOADER (5-8 Detik) & ASYNC RESOURCE CACHING
              Mengunduh semua CEF (HUD, Char, Inventory, Target) di awal
              sehingga saat dibuka tidak terjadi freeze / patah-patah!
           ----------------------------------------------------------------------- */
        const PRELOAD_PAGES = [
            '../hud/index.html',
            '../char/index.html',
            '../inventory/index.html',
            '../target/index.html'
        ];

        let preloadProgress = 0;
        let preloadDone = false;

        function startCefPreloadSequence() {
            const vault = document.getElementById('cef-preload-vault');
            const percentEl = document.getElementById('preload-percent');
            const barEl = document.getElementById('preload-progress-bar');
            const labelEl = document.getElementById('preload-status-label');
            const preloadingContainer = document.getElementById('preloading-container');
            const authWrap = document.getElementById('auth-main-wrap');

            // 1. Buat hidden iframe untuk memicu Chromium parsing & caching
            PRELOAD_PAGES.forEach(url => {
                try {
                    const ifr = document.createElement('iframe');
                    ifr.src = url;
                    ifr.setAttribute('tabindex', '-1');
                    vault.appendChild(ifr);
                } catch(e) {}
            });

            // 2. Halus 6.5 detik durasi preloading
            const totalDurationMs = 6500;
            const intervalMs = 50;
            const step = 100 / (totalDurationMs / intervalMs);

            const timer = setInterval(() => {
                preloadProgress += step;
                if (preloadProgress > 100) preloadProgress = 100;

                const rounded = Math.floor(preloadProgress);
                percentEl.textContent = `${rounded}%`;
                barEl.style.width = `${rounded}%`;

                if (rounded === 30) {
                    labelEl.textContent = 'Mengunduh Antarmuka Kota...';
                } else if (rounded === 65) {
                    labelEl.textContent = 'Mengoptimalkan Aset CEF...';
                } else if (rounded === 90) {
                    labelEl.textContent = 'Menghubungkan ke Server...';
                }

                if (preloadProgress >= 100) {
                    clearInterval(timer);
                    preloadDone = true;

                    // Hilangkan loading indicator dengan halus
                    preloadingContainer.classList.add('opacity-0', 'scale-95');
                    setTimeout(() => {
                        preloadingContainer.style.display = 'none';
                    }, 700);

                    // Tampilkan form login / register dengan animasi mulus
                    authWrap.classList.remove('opacity-0', 'pointer-events-none');
                    authWrap.classList.add('opacity-100', 'card-enter');

                    // Minta CEF Focus agar keyboard langsung aktif
                    if (window.cef && typeof window.cef.set_focus === 'function') {
                        window.cef.set_focus(true);
                    }

                    // Autofokus ke input password
                    setTimeout(() => {
                        const activePassInput = currentMode === 'login' 
                            ? document.getElementById('login-password')
                            : document.getElementById('register-password');
                        if (activePassInput) activePassInput.focus();
                    }, 400);
                }
            }, intervalMs);
        }

        window.addEventListener('load', () => {
            startCefPreloadSequence();
        });

        /* -----------------------------------------------------------------------
           3. AUTH MODE SWITCHER (LOGIN <-> REGISTER)
           Kontrol penuh dari server open.mp (setAuthMode) tanpa tab switcher manual
           ----------------------------------------------------------------------- */
        let currentMode = 'login'; // 'login' | 'register'
        const cardTitle = document.getElementById('card-title');
        const cardDesc = document.getElementById('card-desc');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const alertBox = document.getElementById('alert-box');

        function switchAuthMode(mode) {
            currentMode = mode;
            hideAlert();

            if (mode === 'register') {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');

                cardTitle.textContent = 'Registrasi Akun UCP';
                cardDesc.textContent = 'Lengkapi PIN verifikasi Discord dan buat kata sandi baru.';
                setTimeout(() => {
                    const codeEl = document.getElementById('register-verify-code');
                    if (codeEl) codeEl.focus();
                }, 100);
            } else {
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');

                cardTitle.textContent = 'Login Akun';
                cardDesc.textContent = 'Masukkan kata sandi akun Anda untuk masuk.';
                setTimeout(() => {
                    const passEl = document.getElementById('login-password');
                    if (passEl) passEl.focus();
                }, 100);
            }
        }

        window.setAuthMode = function(mode) {
            if (mode === 'register' || mode === 'login') {
                switchAuthMode(mode);
            }
        };

        /* -----------------------------------------------------------------------
           4. CEF ACCOUNT SYNC & SUBMIT HANDLERS
           ----------------------------------------------------------------------- */
        const loginNameInput = document.getElementById('login-account-name');
        const regNameInput = document.getElementById('register-account-name');
        const authCard = document.getElementById('auth-card');

        window.setAccountName = function (name) {
            if (name && typeof name === 'string') {
                const trimmed = name.trim();
                loginNameInput.value = trimmed;
                regNameInput.value = trimmed;
            }
        };

        function showAlert(msg, isSuccess = false) {
            const alertText = document.getElementById('alert-text');
            const alertIcon = document.getElementById('alert-icon');

            alertText.textContent = msg;
            alertBox.classList.remove('hidden');

            if (isSuccess) {
                alertBox.className = 'mt-3 rounded-xl px-3 py-2 text-xs flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/25 text-emerald-300';
                alertIcon.className = 'fa-solid fa-circle-check text-emerald-400 shrink-0 text-xs';
            } else {
                alertBox.className = 'mt-3 rounded-xl px-3 py-2 text-xs flex items-center gap-2 bg-red-500/10 border border-red-500/25 text-red-300';
                alertIcon.className = 'fa-solid fa-circle-exclamation text-red-400 shrink-0 text-xs';

                authCard.classList.remove('shake');
                void authCard.offsetWidth;
                authCard.classList.add('shake');
            }
        }

        function hideAlert() {
            alertBox.classList.add('hidden');
        }

        window.showLoginError = function (msg) {
            const submitBtn = document.getElementById('submit-login-btn');
            const btnLabel = document.getElementById('btn-login-label');
            submitBtn.disabled = false;
            btnLabel.textContent = 'MASUK KOTA';

            showAlert(msg || 'Kata sandi yang Anda masukkan salah.');
            const passInput = document.getElementById('login-password');
            passInput.value = '';
            passInput.focus();
        };

        window.showRegisterError = function (msg) {
            const submitBtn = document.getElementById('submit-register-btn');
            const btnLabel = document.getElementById('btn-register-label');
            submitBtn.disabled = false;
            btnLabel.textContent = 'DAFTAR SEKARANG';

            showAlert(msg || 'Pendaftaran gagal. Periksa format kata sandi Anda.');
        };

        window.showRegisterSuccess = function (msg) {
            showAlert(msg || 'Pendaftaran berhasil! Mengalihkan ke login...', true);
            setTimeout(() => {
                switchAuthMode('login');
            }, 1200);
        };

        // Submit Login Form
        function handleLoginSubmit(e) {
            e.preventDefault();
            const username = loginNameInput.value;
            const password = document.getElementById('login-password').value;

            if (!password) {
                showAlert('Kata sandi tidak boleh kosong!');
                return;
            }

            hideAlert();
            const submitBtn = document.getElementById('submit-login-btn');
            const btnLabel = document.getElementById('btn-login-label');
            submitBtn.disabled = true;
            btnLabel.textContent = 'MEMVERIFIKASI...';

            // Kirim event ke CEF open.mp / SA-MP
            if (window.cef && typeof window.cef.emit === 'function') {
                window.cef.emit('cef_onPlayerLoginSubmit', password);
                window.cef.emit('client:onLoginSubmit', username, password);
                window.cef.emit('login_submit', username, password);
                window.cef.emit('onPlayerLogin', password);
            }

            // Simulasi browser dev tanpa CEF
            if (!window.cef) {
                setTimeout(() => {
                    btnLabel.textContent = 'BERHASIL MASUK';
                }, 700);
            }
        }

        // Submit Register Form (Format: UCP, code PIN Discord, pw Password Baru)
        function handleRegisterSubmit(e) {
            e.preventDefault();
            const username = regNameInput.value;
            const verifyCode = document.getElementById('register-verify-code').value.trim();
            const password = document.getElementById('register-password').value;
            const confirmPass = document.getElementById('register-confirm-password').value;

            if (!verifyCode) {
                showAlert('Kode verifikasi Discord / PIN tidak boleh kosong!');
                return;
            }

            if (password.length < 7 || password.length > 32) {
                showAlert('Panjang kata sandi harus antara 7 hingga 32 karakter!');
                return;
            }

            if (password !== confirmPass) {
                showAlert('Konfirmasi kata sandi tidak cocok!');
                return;
            }

            hideAlert();
            const submitBtn = document.getElementById('submit-register-btn');
            const btnLabel = document.getElementById('btn-register-label');
            submitBtn.disabled = true;
            btnLabel.textContent = 'MENDAFTARKAN...';

            if (window.cef && typeof window.cef.emit === 'function') {
                window.cef.emit('cef_onPlayerRegisterSubmit', password, verifyCode);
                window.cef.emit('client:onRegisterSubmit', username, verifyCode, password);
                window.cef.emit('register_submit', username, password, verifyCode);
            }

            if (!window.cef) {
                setTimeout(() => {
                    showRegisterSuccess('Akun berhasil dibuat! Silakan masuk.');
                }, 800);
            }
        }

        // Keluar Game
        function handleQuitGame() {
            if (window.cef && typeof window.cef.emit === 'function') {
                window.cef.emit('cef_onPlayerLoginQuit');
                window.cef.emit('client:onQuitGame');
            }
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
            input.focus();
        }

        // CEF Event Bindings
        if (window.cef && typeof window.cef.on === 'function') {
            window.cef.on('setLoginData', (name) => window.setAccountName(name));
            window.cef.on('sync_account', (name) => window.setAccountName(name));
            window.cef.on('set_account_name', (name) => window.setAccountName(name));
            window.cef.on('setAuthMode', (mode) => window.setAuthMode(mode));
            window.cef.on('loginError', (msg) => window.showLoginError(msg));
            window.cef.on('login_error', (msg) => window.showLoginError(msg));
            window.cef.on('registerError', (msg) => window.showRegisterError(msg));
            window.cef.on('registerSuccess', (msg) => window.showRegisterSuccess(msg));
        }

        // Support window postMessage & query params (?user=Nama_UCP)
        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data) return;
            if (data.type === 'sync_account' || data.action === 'setAccountName') {
                window.setAccountName(data.name || data.username);
            }
            if (data.type === 'setAuthMode') {
                window.setAuthMode(data.mode);
            }
            if (data.type === 'login_error' || data.action === 'showLoginError') {
                window.showLoginError(data.message);
            }
        });

        (function initFromQuery() {
            const params = new URLSearchParams(window.location.search);
            const user = params.get('name') || params.get('user') || params.get('player') || params.get('ucp');
            if (user) window.setAccountName(user);
            const mode = params.get('mode');
            if (mode) window.setAuthMode(mode);
        })();

        /* -----------------------------------------------------------------------
           5. MUSIC CONTROLLER: LIL TATANG - KAU DAN BASURI (YOUTUBE AUTOPLAY)
           ----------------------------------------------------------------------- */
        let isMusicOn = true; // Musik otomatis memutar saat masuk halaman login
        let ytPlayer = null;
        let isYtReady = false;
        const audioEl = document.getElementById('bg-music');
        const musicWidget = document.getElementById('music-widget');
        const musicStateText = document.getElementById('music-state-text');
        const speakerIcon = document.getElementById('speaker-icon');
        let audioCtx = null;
        let synthTimer = null;

        // Callback resmi YouTube IFrame Player API untuk video zwKyJRI8Unc (Lil Tatang - Kau Dan Basuri)
        window.onYouTubeIframeAPIReady = function() {
            ytPlayer = new YT.Player('yt-player', {
                height: '200',
                width: '200',
                videoId: 'zwKyJRI8Unc',
                playerVars: {
                    'autoplay': 1,
                    'loop': 1,
                    'playlist': 'zwKyJRI8Unc',
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'rel': 0
                },
                events: {
                    'onReady': function(event) {
                        isYtReady = true;
                        if (isMusicOn) {
                            try {
                                event.target.setVolume(75);
                                event.target.playVideo();
                            } catch(e) {}
                            setMusicUI(true);
                        }
                    },
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.PLAYING) {
                            setMusicUI(true);
                        } else if (event.data === YT.PlayerState.PAUSED) {
                            if (!isMusicOn) setMusicUI(false);
                        } else if (event.data === YT.PlayerState.ENDED) {
                            if (isMusicOn && ytPlayer) ytPlayer.playVideo();
                        }
                    }
                }
            });
        };

        function setMusicUI(playing) {
            musicWidget.setAttribute('aria-checked', String(playing));
            if (playing) {
                musicWidget.classList.add('is-playing');
                musicStateText.textContent = 'ON â€¢ Sedang Berputar';
                musicStateText.classList.replace('text-zinc-500', 'text-brand-light');
                speakerIcon.className = 'fa-solid fa-volume-high text-xs text-brand-orange';
            } else {
                musicWidget.classList.remove('is-playing');
                musicStateText.textContent = 'OFF';
                musicStateText.classList.replace('text-brand-light', 'text-zinc-500');
                speakerIcon.className = 'fa-solid fa-volume-xmark text-xs';
            }
        }

        const chords = [
            [220.00, 277.18, 329.63, 415.30], // Amaj7 warm sunset
            [196.00, 246.94, 293.66, 369.99], // Gmaj7
            [146.83, 220.00, 277.18, 329.63], // Dmaj9
            [164.81, 207.65, 246.94, 329.63]  // E6
        ];
        let chordStep = 0;

        function playSunsetPad() {
            if (!isMusicOn || !audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = chords[chordStep % chords.length];
            chordStep++;

            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc.type = i === 0 ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(freq, now + i * 0.06);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(680, now);

                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.02, now + 0.65);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.6);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + i * 0.06);
                osc.stop(now + 3.7);
            });
        }

        function startSynthFallback() {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!audioCtx) audioCtx = new AudioContextClass();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playSunsetPad();
            synthTimer = setInterval(playSunsetPad, 3400);
        }

        function stopSynthFallback() {
            if (synthTimer) {
                clearInterval(synthTimer);
                synthTimer = null;
            }
        }

        function toggleMusic() {
            isMusicOn = !isMusicOn;
            setMusicUI(isMusicOn);

            if (isMusicOn) {
                if (isYtReady && ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    ytPlayer.playVideo();
                } else if (audioEl) {
                    audioEl.volume = 0.45;
                    audioEl.play().catch(() => startSynthFallback());
                }
            } else {
                if (isYtReady && ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
                    ytPlayer.pauseVideo();
                }
                if (audioEl) audioEl.pause();
                stopSynthFallback();
            }
        }

        // Jalankan autoplay musik saat halaman dibuka
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (isMusicOn) {
                    if (isYtReady && ytPlayer && typeof ytPlayer.playVideo === 'function') {
                        ytPlayer.playVideo();
                    } else if (audioEl) {
                        audioEl.volume = 0.45;
                        audioEl.play().catch(() => {});
                    }
                }
            }, 500);
        });

        // Trigger autoplay pada klik pengguna jika browser membatasi autoplay tanpa user gesture
        function unlockAudioOnInteraction() {
            if (isMusicOn) {
                if (isYtReady && ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    ytPlayer.playVideo();
                } else if (audioEl) {
                    audioEl.volume = 0.45;
                    audioEl.play().catch(() => {});
                }
            }
            window.removeEventListener('click', unlockAudioOnInteraction);
            window.removeEventListener('keydown', unlockAudioOnInteraction);
        }
        window.addEventListener('click', unlockAudioOnInteraction, { once: true });
        window.addEventListener('keydown', unlockAudioOnInteraction, { once: true });
    </script>
</body>
