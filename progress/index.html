<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKRP - Frameless Progress Bar</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Frameless Floating Progress Bar -->
    <div class="progress-wrapper" id="progBox" style="display: none;">
        <div class="progress-info">
            <span id="progText">Memproses...</span>
            <span class="progress-percent" id="progPercent">0%</span>
        </div>
        <div class="chevron-track" id="progTrack">
            <!-- 22 Chevron segments dynamically generated -->
        </div>
    </div>

    <!-- Dev Preview Control (Hanya tampil saat dibuka di browser biasa) -->
    <div id="devTestBar" class="dev-test-container" style="display: none;">
        <button onclick="ProgressApp.startTestAnimation()" class="dev-btn">
            ▶ Tes Animasi Progress (4.5s)
        </button>
    </div>

    <!-- Scripts -->
    <script src="../common/cef-bridge.js"></script>
    <script src="script.js"></script>
</body>
</html>
