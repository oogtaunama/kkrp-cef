<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKRP - Radial Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="radialBackdrop" class="radial-backdrop">
    <div id="radialRoot" class="radial-container">
      <!-- SVG Pie Menu Background / Segments -->
      <svg class="radial-svg" viewBox="-250 -250 500 500" id="radialSvg">
        <defs>
          <linearGradient id="sliceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(32, 28, 30, 0.95)" />
            <stop offset="100%" stop-color="rgba(16, 17, 21, 0.98)" />
          </linearGradient>
          <linearGradient id="sliceGradHover" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(255, 158, 68, 0.35)" />
            <stop offset="100%" stop-color="rgba(255, 122, 24, 0.15)" />
          </linearGradient>
          <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <!-- Dynamic SVG Slices rendered via JS -->
        <g id="slicesGroup"></g>
      </svg>

      <!-- Center Hub Indicator -->
      <div class="radial-center" id="radialCenter" title="Klik untuk Tutup / Kembali">
        <div class="center-pulse"></div>
        <div class="center-icon" id="centerIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3v18M3 12h18"/>
          </svg>
        </div>
        <div class="center-label" id="centerTitle">MENU UTAMA</div>
        <div class="center-sub" id="centerSub">Arahkan Kursor</div>
        <button type="button" class="center-back-btn" id="btnCenterBack" style="display:none;" title="Kembali ke Menu Utama">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span>KEMBALI</span>
        </button>
        <button type="button" class="center-close-btn" id="btnCenterClose" title="Tutup Radial Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          <span>TUTUP</span>
        </button>
      </div>

      <!-- HTML Item Icons & Labels Placed Over Slices -->
      <div class="radial-items-overlay" id="itemsOverlay"></div>

      <!-- Quick Tooltip / Helper Hint -->
      <div class="radial-hint">
        <span class="key-badge">N</span> / <span class="key-badge">ESC</span> / <span class="key-badge">KLIK LUAR</span> Tutup
      </div>
    </div>
  </div>

  <script src="../common/cef-bridge.js"></script>
  <script src="script.js"></script>
</body>
</html>
